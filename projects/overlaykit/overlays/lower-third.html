<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lower third</title>
<link rel="stylesheet" href="base.css">
<style>
  .l3 { position: absolute; left: 60px; bottom: 80px; display: flex; align-items: stretch; transform: translateX(-120%);
    transition: transform .7s cubic-bezier(.2,.9,.2,1); }
  .l3.in { transform: none; }
  .accent { width: 14px; background: linear-gradient(var(--accent), var(--accent2)); border-radius: 8px 0 0 8px; }
  .box { background: color-mix(in srgb, var(--panel) 92%, transparent); padding: 18px 34px; border-radius: 0 14px 14px 0; min-width: 520px; }
  .name { font-family: var(--font); font-size: 44px; text-transform: uppercase; letter-spacing: .04em; }
  .line { font-size: 30px; color: var(--muted); transition: opacity .4s; }
</style>
<script src="themes.js"></script><script src="lib.js"></script>
</head>
<body class="transparent">
<div class="l3" id="l3"><div class="accent"></div><div class="box"><div class="name" id="name">Your Name</div><div class="line" id="line">Now playing</div></div></div>
<script>
  // ?name=...&messages=Now playing: X|!discord for the server|Follow for notifications&every=45&hold=12
  var P = Overlay.parseParams(location.search);
  Overlay.applyTheme(document, Overlay.resolveTheme(window.OVERLAY_THEMES, P));
  if (P.name) document.getElementById('name').textContent = P.name;
  var msgs = (P.messages || 'Now playing|Follow for notifications').split('|'), i = 0;
  var el = document.getElementById('l3'), line = document.getElementById('line');
  var every = (Number(P.every) || 45) * 1000, hold = (Number(P.hold) || 12) * 1000;
  function show() { line.textContent = msgs[i++ % msgs.length]; el.classList.add('in'); setTimeout(function () { el.classList.remove('in'); }, hold); }
  show(); setInterval(show, every);
</script>
</body></html>
