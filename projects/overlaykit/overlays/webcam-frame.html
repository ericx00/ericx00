<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Webcam frame</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Size the OBS source to the camera, e.g. 640x360. ?w=640&h=360 */
  html, body { width: auto; height: auto; }
  .frame { position: absolute; inset: 0; border-radius: 18px; border: 4px solid var(--accent);
    box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 50%, transparent), inset 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent); }
  .corner { position: absolute; width: 60px; height: 60px; border: 6px solid var(--accent2); }
  .tl { top: -6px; left: -6px; border-right: 0; border-bottom: 0; border-top-left-radius: 20px; }
  .br { bottom: -6px; right: -6px; border-left: 0; border-top: 0; border-bottom-right-radius: 20px; }
  .tag { position: absolute; left: 24px; bottom: -22px; padding: 6px 18px; border-radius: 10px; font-size: 26px;
    background: var(--accent); color: var(--bg); font-family: var(--font); text-transform: uppercase; letter-spacing: .05em; }
</style>
<script src="themes.js"></script><script src="lib.js"></script>
</head>
<body class="transparent">
  <div id="wrap" style="position:relative;margin:30px">
    <div class="frame"><div class="corner tl"></div><div class="corner br"></div></div>
    <div class="tag" id="tag"></div>
  </div>
<script>
  var P = Overlay.parseParams(location.search);
  Overlay.applyTheme(document, Overlay.resolveTheme(window.OVERLAY_THEMES, P));
  var w = Number(P.w) || 640, h = Number(P.h) || 360, wrap = document.getElementById('wrap');
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  document.body.style.width = (w + 60) + 'px'; document.body.style.height = (h + 70) + 'px';
  var tag = document.getElementById('tag');
  if (P.name) tag.textContent = P.name; else tag.remove();
</script>
</body></html>
