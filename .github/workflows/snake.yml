name: snake

# Turns the contribution graph into a snake game, pushed to the `output` branch.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff7a2f&color_dots=#161b22,#3b2a1f,#7a3a14,#c2561c,#ff7a2f
            dist/snake-light.svg?color_snake=#ff7a2f&color_dots=#ebedf0,#ffd9c2,#ffb385,#ff9452,#ff7a2f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
