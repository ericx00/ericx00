name: sky

# Redraws the header for the current Nairobi time, weather and moon phase.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sky
  cancel-in-progress: true

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/gen.py --sky
      - name: commit if the sky changed
        run: |
          if git diff --quiet assets/header.svg; then echo "sky unchanged"; exit 0; fi
          git config user.name "sky-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg
          git commit -m "sky: $(date -u -d '+3 hours' '+%H:00') Nairobi [skip ci]"
          git push
